<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/dvbFavicon.png">
    <title>DVB | Exodus</title>
    <style>
        :root {
            --texte: rgb(255, 255, 255);
            --DVB-background: rgb(1, 1, 40);
            --DVB-secondaire: rgb(153, 170, 255);
            --danger-color: rgb(239, 68, 68);
            --success-color: rgb(34, 197, 94);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--DVB-background);
            color: var(--texte);
            margin: 0;
            padding: 20px;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        h1 {
            text-align: center;
            color: var(--texte);
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(179, 194, 255, 0.5);
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .section {
            background-color: var(--DVB-background);
            border-radius: 10px;
            padding: 20px;
            width: 300px;
            box-shadow: 3px 3px 3px var(--DVB-secondaire);
            border: 3px solid rgb(153 170 255 / 0.8);
        }

        h2 {
            color: var(--texte);
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-bottom: 3px solid var(--DVB-secondaire);
            padding-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: var(--texte);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            width: calc(50% - 10px);
        }

        #onButton {
            background-color: var(--success-color);
        }

        #onButton:hover {
            background-color: rgba(34, 197, 94, 0.8);
        }

        #offButton {
            background-color: var(--danger-color);
        }

        #offButton:hover {
            background-color: rgba(239, 68, 68, 0.8);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .controls button {
            flex: 1;
            width: auto;
            margin: 0;
            padding: 15px;
            font-size: 18px;
            opacity: 0.4;
            filter: saturate(0.5);
        }

        .controls button.is-active {
            opacity: 1;
            filter: none;
        }

        #onButton.is-active {
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.85);
        }

        #offButton.is-active {
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.85);
        }

        .param {
            margin-top: 15px;
        }

        .param-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .param-head label {
            font-weight: 600;
        }

        .param-value {
            font-weight: 700;
            color: var(--DVB-secondaire);
            font-variant-numeric: tabular-nums;
        }

        .slider {
            position: relative;
            display: block;
            height: 20px;
            margin-top: 4px;
        }

        .slider-track {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 8px;
            transform: translateY(-50%);
            border-radius: 4px;
            background-color: rgba(153, 170, 255, 0.25);
            overflow: hidden;
        }

        .slider-fill {
            width: 50%;
            height: 100%;
            border-radius: 4px;
            background-color: var(--DVB-secondaire);
            box-shadow: 0 0 8px rgba(153, 170, 255, 0.8);
        }

        .slider input[type=range] {
            position: relative;
            z-index: 2;
            display: block;
            width: 100%;
            height: 20px;
            margin: 0;
            padding: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider input[type=range]::-webkit-slider-runnable-track {
            height: 20px;
            background: transparent;
            border: none;
        }

        .slider input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            margin-top: 0;
            border-radius: 50%;
            background-color: var(--texte);
            border: 3px solid var(--DVB-secondaire);
            box-shadow: 0 0 8px rgba(153, 170, 255, 0.8);
            cursor: pointer;
        }

        .slider input[type=range]::-moz-range-track {
            height: 20px;
            background: transparent;
            border: none;
        }

        .slider input[type=range]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--texte);
            border: 3px solid var(--DVB-secondaire);
            box-shadow: 0 0 8px rgba(153, 170, 255, 0.8);
            cursor: pointer;
        }

        #status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            margin-top: 20px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        #status::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        #status.on {
            color: var(--success-color);
        }

        #status.off {
            color: var(--danger-color);
        }

        .sensor {
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(153, 170, 255, 0.4);
            border-radius: 5px;
            border-left: 5px solid var(--DVB-secondaire);
            font-weight: 600;
        }

        canvas {
            background-color: var(--DVB-background);
            border-radius: 10px;
            margin-top: 20px;
            border: 3px solid var(--DVB-secondaire);
        }

        .connection {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #connectBtn {
            background-color: var(--DVB-secondaire);
            width: 100%;
        }

        #connectBtn:hover {
            background-color: rgba(153, 170, 255, 0.8);
            transform: scale(1.02);
        }

        #connectionStatus {
            margin-top: 10px;
            font-weight: 600;
        }

        .connected {
            color: var(--success-color);
        }

        .disconnected {
            color: var(--danger-color);
        }

        @media (max-width: 420px) {
            body {
                padding: 12px;
            }

            .section {
                width: 100%;
                box-sizing: border-box;
            }

            h1 {
                font-size: 1.8rem;
            }
        }

            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(110, 100, 255, 0.2);
        } */

</head>

<body>
    <!-- <div class="header">
        <img src="https://media.discordapp.net/attachments/1296821317898735646/1451249820542177402/Capture_decran_2025-12-17_160007.png?ex=69457d38&is=69442bb8&hm=db2ba0cc3d26f2c584ba4aa90527a7d28fdf9c7a44e270e93bb04ef2a30a87d8&=&format=webp&quality=lossless&width=354&height=349" alt="Logo" class="logo">
    </div> -->
    <h1>Interface de Contrôle Exodus</h1>
    <br>
    <div class="container">
        <div class="section">
            <!-- <img class="exoskeleton-image" src="https://media.discordapp.net/attachments/1296821317898735646/1451249820273610875/IMG_7858.jpeg?ex=69457d38&is=69442bb8&hm=c769c8922fec1301107df35c09a9475fa50ca5d721146407f4b1d20cca16bec3&=&format=webp&width=885&height=541" alt="Exoskeleton"> -->
            <h2>Contrôles</h2>
            <div class="controls">
                <button id="onButton" aria-pressed="false">ON</button>
                <button id="offButton" aria-pressed="false">OFF</button>
            </div>
            <div id="status" class="off" role="status" aria-live="polite">Status: OFF</div>
        </div>

        <div class="section">
            <h2>Paramètres</h2>

            <div class="param">
                <div class="param-head">
                    <label for="speedRange">Vitesse du moteur</label>
                    <span class="param-value" id="speedValue">50 %</span>
                </div>
                <div class="slider">
                    <div class="slider-track">
                        <div class="slider-fill" id="speedFill"></div>
                    </div>
                    <input type="range" id="speedRange" min="0" max="100" step="1" value="50">
                </div>
            </div>

            <div class="param">
                <div class="param-head">
                    <label for="forceRange">Force d'assistance</label>
                    <span class="param-value" id="forceValue">50 %</span>
                </div>
                <div class="slider">
                    <div class="slider-track">
                        <div class="slider-fill" id="forceFill"></div>
                    </div>
                    <input type="range" id="forceRange" min="0" max="100" step="1" value="50">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Capteurs</h2>
            <div class="sensor">Température du moteur : <span id="tempMotor">0</span> °C</div>
            <div class="sensor">Tension de la batterie : <span id="battery">0</span> V</div>
            <div class="sensor">Angle de l'articulation : <span id="angle">0</span> °</div>
            <div class="sensor">Vitesse : <span id="rpm">0</span> RPM</div>
            <div class="sensor">Courant moteur : <span id="current">0</span> A</div>
            <div class="sensor">Charge estimée : <span id="chargeKg">0</span> kg</div>
        </div>

        <div class="section">
            <h2>Charge portée (kg)</h2>
            <canvas id="graph" width="300" height="200" style="background: rgba(0,0,20,0.4); border-radius: 6px;"></canvas>
        </div>

        <div class="section">
            <h2>Connexion</h2>
            <div class="connection">
                <button id="connectBtn">Connexion</button>
                <span id="connectionStatus" class="disconnected">Déconnecté</span>
            </div>
        </div>
    </div>

    <script>
        /* État partagé de l'interface : une seule source de vérité. */
        const exodus = {
            power: false,
            speed: 50,
            force: 50
        };

        /* --- Sliders ------------------------------------------------------ */

        function bindRange(range, fill, output, key) {
            const update = () => {
                const min = Number(range.min) || 0;
                const max = Number(range.max) || 100;
                const value = Number(range.value);
                const percent = max > min ? ((value - min) / (max - min)) * 100 : 0;
                const label = value + ' %';

                exodus[key] = value;
                fill.style.width = percent + '%';
                range.setAttribute('aria-valuetext', label);
                if (output) {
                    output.textContent = label;
                }
            };

            range.addEventListener('input', update);
            range.addEventListener('change', update);
            update();
        }

        bindRange(
            document.getElementById('speedRange'),
            document.getElementById('speedFill'),
            document.getElementById('speedValue'),
            'speed'
        );

        bindRange(
            document.getElementById('forceRange'),
            document.getElementById('forceFill'),
            document.getElementById('forceValue'),
            'force'
        );

        /* --- Boutons ON / OFF --------------------------------------------- */

        const onButton = document.getElementById('onButton');
        const offButton = document.getElementById('offButton');
        const statusOutput = document.getElementById('status');

        function renderPower() {
            const isOn = exodus.power;

            onButton.classList.toggle('is-active', isOn);
            offButton.classList.toggle('is-active', !isOn);
            onButton.setAttribute('aria-pressed', String(isOn));
            offButton.setAttribute('aria-pressed', String(!isOn));

            statusOutput.textContent = isOn ? 'Status: ON' : 'Status: OFF';
            statusOutput.classList.toggle('on', isOn);
            statusOutput.classList.toggle('off', !isOn);
        }

        function setPower(value) {
            exodus.power = Boolean(value);
            renderPower();
        }

        onButton.addEventListener('click', () => setPower(true));
        offButton.addEventListener('click', () => setPower(false));

        renderPower();

        /* --- Graphique Canvas 2D en temps réel (Charge portée) ------------ */
        const canvas = document.getElementById('graph');
        const ctx = canvas.getContext('2d');
        const maxPoints = 40;
        const historyData = new Array(maxPoints).fill(0);

        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grille & axes
            ctx.strokeStyle = 'rgba(153, 170, 255, 0.2)';
            ctx.lineWidth = 1;
            for (let y = 40; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(35, y);
                ctx.lineTo(canvas.width - 10, y);
                ctx.stroke();
            }

            // Calcul de l'échelle dynamique
            const maxVal = Math.max(10, Math.ceil(Math.max(...historyData) * 1.2));

            // Graduation axe Y
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '11px Rajdhani, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(maxVal + 'kg', 30, 15);
            ctx.fillText((maxVal / 2).toFixed(1) + 'kg', 30, canvas.height / 2 + 4);
            ctx.fillText('0kg', 30, canvas.height - 10);

            // Courbe
            ctx.beginPath();
            const stepX = (canvas.width - 50) / (maxPoints - 1);
            const startX = 40;
            const bottomY = canvas.height - 15;
            const usableH = canvas.height - 30;

            historyData.forEach((val, idx) => {
                const x = startX + idx * stepX;
                const y = bottomY - (val / maxVal) * usableH;
                if (idx === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });

            ctx.strokeStyle = '#99aaff';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Remplissage sous la courbe (dégradé)
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, 'rgba(153, 170, 255, 0.35)');
            gradient.addColorStop(1, 'rgba(153, 170, 255, 0.0)');

            ctx.lineTo(startX + (maxPoints - 1) * stepX, bottomY);
            ctx.lineTo(startX, bottomY);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            // Valeur courante affichée en haut à droite
            const latest = historyData[historyData.length - 1];
            ctx.fillStyle = '#22c55e';
            ctx.font = 'bold 13px Rajdhani, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(latest.toFixed(1) + ' kg', canvas.width - 10, 20);
        }

        /* --- Récupération des données télémétrie en temps réel (/data) --- */
        const connectionStatus = document.getElementById('connectionStatus');
        let isFetching = false;

        async function fetchTelemetry() {
            if (isFetching) return;
            isFetching = true;
            try {
                const response = await fetch('/data', { cache: 'no-store' });
                if (response.ok) {
                    const data = await response.json();

                    // Mise à jour des valeurs textuelles
                    if (data.tempMotor !== undefined) document.getElementById('tempMotor').textContent = data.tempMotor.toFixed(1);
                    if (data.battery !== undefined) document.getElementById('battery').textContent = data.battery.toFixed(1);
                    if (data.angle !== undefined) document.getElementById('angle').textContent = data.angle.toFixed(1);
                    if (data.rpm !== undefined) document.getElementById('rpm').textContent = Math.round(data.rpm);
                    if (data.current !== undefined) document.getElementById('current').textContent = data.current.toFixed(2);
                    if (data.chargeKg !== undefined) document.getElementById('chargeKg').textContent = data.chargeKg.toFixed(2);

                    // Mise à jour de l'historique et du graphique
                    const charge = data.chargeKg !== undefined ? Math.max(0, data.chargeKg) : 0;
                    historyData.shift();
                    historyData.push(charge);
                    drawGraph();

                    // État connexion
                    if (connectionStatus) {
                        connectionStatus.textContent = 'Connecté';
                        connectionStatus.className = 'connected';
                    }
                } else {
                    throw new Error('Erreur HTTP ' + response.status);
                }
            } catch (err) {
                if (connectionStatus) {
                    connectionStatus.textContent = 'Déconnecté';
                    connectionStatus.className = 'disconnected';
                }
            } finally {
                isFetching = false;
            }
        }

        // Rafraîchissement toutes les 200 ms (5 Hz)
        setInterval(fetchTelemetry, 200);
        drawGraph();
    </script>
</body>

</html>
